# @package _global_
training:
  task_name: OmniCarGridAvoidance
  sim_backend: mujoco
  no_play: true
  play_render_mode: none
  play_steps: 0

algo:
  num_envs: 64
  num_steps_per_env: 16
  max_iterations: 20
  save_interval: 10
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    cnn_feature_dim: 128
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.5
      std_type: scalar
  critic:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    cnn_feature_dim: 128
  algorithm:
    num_learning_epochs: 2
    num_mini_batches: 4
    learning_rate: 5.0e-4
    desired_kl: 0.02
    entropy_coef: 0.005

env:
  max_episode_seconds: 12.0
  sim_dt: 0.05
  ctrl_dt: 0.05
  command:
    max_x_speed: 2.0
    max_y_speed: 2.0
    max_yaw_rate: 2.0
    resample_interval_s: 2.0
  grid:
    size: 80
    cell_size: 0.05
    safety_margin_m: 0.05
  body:
    length_m: 0.48
    width_m: 0.32
  obstacles:
    count: 14
    radius_min_m: 0.10
    radius_max_m: 0.28
    box_length_min_m: 0.22
    box_length_max_m: 0.75
    box_width_min_m: 0.12
    box_width_max_m: 0.45
    wall_length_min_m: 1.0
    wall_length_max_m: 2.4
    wall_width_min_m: 0.08
    wall_width_max_m: 0.18
    circle_fraction: 0.50
    box_fraction: 0.35
    wall_fraction: 0.15
    spawn_radius_m: 3.2
    keepout_radius_m: 0.75
  reward:
    intent: 5.0
    intent_projection: 1.5
    yaw_intent: 1.2
    response: 1.5
    vx_diff: 1.2
    vy_diff: 1.2
    vyaw_diff: 1.8
    vx_jerk: 0.5
    vy_jerk: 0.5
    vyaw_jerk: 0.8
    clearance: 0.8
    collision: -8.0
  physical_limits:
    max_x_speed: 2.0
    max_y_speed: 2.0
    max_yaw_rate: 2.0
    max_x_accel: 3.0
    max_y_accel: 3.0
    max_yaw_accel: 4.0

reward:
  intent: 5.0
  intent_projection: 1.5
  yaw_intent: 1.2
  response: 1.5
  vx_diff: 1.2
  vy_diff: 1.2
  vyaw_diff: 1.8
  vx_jerk: 0.5
  vy_jerk: 0.5
  vyaw_jerk: 0.8
  clearance: 0.8
  collision: -8.0
