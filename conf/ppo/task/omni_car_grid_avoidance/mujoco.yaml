# @package _global_
training:
  task_name: OmniCarGridAvoidance
  sim_backend: mujoco
  no_play: true
  play_render_mode: none
  play_steps: 0

algo:
  num_envs: 128
  num_steps_per_env: 32
  max_iterations: 260
  save_interval: 10
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    cnn_feature_dim: 128
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.5
      std_type: scalar
  critic:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    cnn_feature_dim: 128
  algorithm:
    num_learning_epochs: 2
    num_mini_batches: 4
    learning_rate: 5.0e-4
    desired_kl: 0.02
    entropy_coef: 0.005

env:
  max_episode_seconds: 60.0
  obs_history_len: 24
  sim_dt: 0.05
  ctrl_dt: 0.05
  command:
    max_x_speed: 2.0
    max_y_speed: 2.0
    max_yaw_rate: 2.0
    resample_interval_s: 2.5
    deadband: 0.10
    smoothing_tau_s: 0.55
  grid:
    size: 80
    cell_size: 0.05
    safety_margin_m: 0.05
  body:
    length_m: 0.48
    width_m: 0.32
  obstacles:
    count: 18
    radius_min_m: 0.10
    radius_max_m: 0.38
    box_length_min_m: 0.22
    box_length_max_m: 1.24
    box_width_min_m: 0.12
    box_width_max_m: 0.86
    wall_length_min_m: 1.0
    wall_length_max_m: 3.8
    wall_width_min_m: 0.08
    wall_width_max_m: 0.28
    circle_fraction: 0.35
    box_fraction: 0.35
    wall_fraction: 0.30
    spawn_radius_m: 4.2
    keepout_radius_m: 0.90
  reward:
    intent: 15.0
    intent_projection: 5.5
    yaw_intent: 4.5
    response: 10.0
    vx_diff: 6.0
    vy_diff: 6.0
    vyaw_diff: 8.0
    vx_jerk: 3.0
    vy_jerk: 3.0
    vyaw_jerk: 4.2
    clearance: 2.2
    collision: -24.0
  physical_limits:
    max_x_speed: 2.0
    max_y_speed: 2.0
    max_yaw_rate: 2.0
    max_x_accel: 3.5
    max_y_accel: 3.5
    max_yaw_accel: 4.5

reward:
  intent: 15.0
  intent_projection: 5.5
  yaw_intent: 4.5
  response: 10.0
  vx_diff: 6.0
  vy_diff: 6.0
  vyaw_diff: 8.0
  vx_jerk: 3.0
  vy_jerk: 3.0
  vyaw_jerk: 4.2
  clearance: 2.2
  collision: -24.0
