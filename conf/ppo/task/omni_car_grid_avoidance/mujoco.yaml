# @package _global_
training:
  task_name: OmniCarGridAvoidance
  sim_backend: mujoco
  no_play: true
  play_render_mode: none
  play_steps: 0

algo:
  num_envs: 128
  num_steps_per_env: 32
  max_iterations: 260
  save_interval: 10
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNGRUModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    grid_history_len: 10
    cnn_feature_dim: 128
    gru_hidden_dim: 128
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.5
      std_type: scalar
  critic:
    class_name: unilab.algos.torch.omni_car:OmniCarGridCNNGRUModel
    hidden_dims: [256, 128]
    activation: elu
    obs_normalization: true
    grid_size: 80
    grid_history_len: 10
    cnn_feature_dim: 128
    gru_hidden_dim: 128
  algorithm:
    num_learning_epochs: 2
    num_mini_batches: 4
    learning_rate: 5.0e-4
    desired_kl: 0.02
    entropy_coef: 0.004

env:
  max_episode_seconds: 300.0
  grid_history_len: 10
  obs_history_len: 24
  sim_dt: 0.05
  ctrl_dt: 0.05
  command:
    max_x_speed: 2.0
    max_y_speed: 1.0
    max_yaw_rate: 2.0
    resample_interval_s: 2.5
    hold_min_s: 2.0
    hold_max_s: 8.0
    long_hold_fraction: 0.40
    long_hold_min_s: 8.0
    long_hold_max_s: 35.0
    zero_fraction: 0.30
    # Order: vx, vy, vyaw, vx+vy, vx+vyaw, vy+vyaw, vx+vy+vyaw.
    mode_weights: [0.10, 0.10, 0.10, 0.22, 0.10, 0.10, 0.28]
    deadband: 0.10
    smoothing_tau_s: 0.55
    zero_snap_norm: 0.10
  human_command:
    enabled: false
    env_index: random
    replay_fanout: 0
    backend: pygame
    joystick_index: 0
    require_joystick: true
    deadzone: 0.15
    zero_snap_norm: 0.10
    smoothing_tau_s: 0.10
    idle_action_hold: true
    idle_action_hold_norm: 0.12
    axis_vx: 1
    axis_vy: 0
    axis_vyaw: 3
    invert_vx: true
    invert_vy: false
    invert_vyaw: false
    render_enabled: false
    render_every_steps: 1
  grid:
    size: 80
    cell_size: 0.05
    safety_margin_m: 0.05
  body:
    length_m: 0.56
    width_m: 0.32
  obstacles:
    count: 18
    radius_min_m: 0.10
    radius_max_m: 0.38
    box_length_min_m: 0.22
    box_length_max_m: 1.24
    box_width_min_m: 0.12
    box_width_max_m: 0.86
    wall_length_min_m: 1.0
    wall_length_max_m: 3.8
    wall_width_min_m: 0.08
    wall_width_max_m: 0.28
    circle_fraction: 0.35
    box_fraction: 0.35
    wall_fraction: 0.30
    spawn_radius_m: 4.2
    keepout_radius_m: 0.90
    front_blocker_fraction: 0.33
    side_wall_fraction: 0.25
    front_blocker_box_fraction: 0.30
    front_blocker_wall_fraction: 0.45
  large_scene:
    enabled: true
    world_size_m: 36.0
    static_obstacle_count: 260
    max_local_static_obstacles: 72
    max_dynamic_agents: 24
    dense_region_count: 6
    dense_region_fraction: 0.58
    dense_region_radius_min_m: 2.0
    dense_region_radius_max_m: 5.2
    border_wall_segments_per_side: 28
    border_wall_thickness_m: 0.35
    agent_collision_radius_m: 0.34
    agent_spawn_keepout_m: 0.60
    reset_on_timeout: false
    stagnation_warmup_steps: 240
    stagnation_window_steps: 420
    stagnation_min_return_delta: 1.0
    resample_scene_on_full_reset: false
  reward:
    intent: 48.0
    intent_projection: 22.0
    yaw_intent: 10.0
    response: 24.0
    clearance_motion: 80.0
    clearance_target_motion: 100.0
    idle_stop: 40.0
    yaw_idle_stop: 30.0
    off_axis: 28.0
    reverse: 45.0
    vx_track: 9.0
    vy_track: 9.0
    vyaw_track: 20.0
    vx_diff: 6.0
    vy_diff: 6.0
    vyaw_diff: 7.0
    vx_jerk: 3.0
    vy_jerk: 3.0
    vyaw_jerk: 3.4
    clearance: 6.0
    collision: -120.0
  physical_limits:
    max_x_speed: 2.0
    max_y_speed: 1.0
    max_yaw_rate: 2.0
    max_x_accel: 3.5
    max_y_accel: 3.5
    max_yaw_accel: 4.5

reward:
  intent: 48.0
  intent_projection: 22.0
  yaw_intent: 10.0
  response: 24.0
  clearance_motion: 80.0
  clearance_target_motion: 100.0
  idle_stop: 40.0
  yaw_idle_stop: 30.0
  off_axis: 28.0
  reverse: 45.0
  vx_track: 9.0
  vy_track: 9.0
  vyaw_track: 20.0
  vx_diff: 6.0
  vy_diff: 6.0
  vyaw_diff: 7.0
  vx_jerk: 3.0
  vy_jerk: 3.0
  vyaw_jerk: 3.4
  clearance: 6.0
  collision: -120.0
